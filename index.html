<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="description" content="Count adults and children attending your gatherings by family." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Guest Counter</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172235;background:#f4f7fb;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.38;cursor:not-allowed}
    .shell{max-width:640px;margin:0 auto;padding:20px 14px 40px}.card{background:#fff;border:1px solid #e0e6ef;border-radius:18px;padding:18px;box-shadow:0 3px 18px #1d3d7210}
    header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}h1{font-size:1.5rem;margin:0;letter-spacing:-.5px}h2{font-size:1.14rem;margin:0}.subtle{color:#617089;font-size:.84rem}
    button{border:1px solid #d4ddeb;background:white;color:#284269;border-radius:10px;padding:9px 12px;font-weight:600;min-height:40px}
    button.primary{background:#1d4ed8;color:white;border-color:#1d4ed8}button.danger{color:#b42331}button.ghost{border-color:transparent;background:transparent}.wrap{display:flex;gap:8px;flex-wrap:wrap}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}.metric{background:#f2f5fa;border-radius:13px;text-align:center;padding:14px 4px}.metric.total{background:#dbeafe}.metric .label{font-size:.78rem;color:#526580}.metric .number{font-size:2rem;line-height:1.3;font-weight:750;font-variant-numeric:tabular-nums}
    .family{padding:15px 0;border-top:1px solid #e4eaf2}.family.off{color:#8c98ab}.family-line{display:flex;align-items:center;justify-content:space-between;gap:8px}.family-name{display:flex;align-items:center;gap:11px;font-weight:650;min-width:0;flex:1}.family-name span{overflow-wrap:anywhere}.family-name input{width:21px;height:21px;accent-color:#1d4ed8;flex:none}.count-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:13px 0 0 32px}.counter .label{text-align:center;font-size:.76rem;color:#65758a;margin-bottom:5px}.controls{display:flex;align-items:center;justify-content:center;gap:5px}.controls button{width:39px;height:39px;padding:0;font-size:1.4rem}.controls output{min-width:27px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
    .actions{display:flex;justify-content:space-between;gap:7px;flex-wrap:wrap;margin-top:18px}.actions button{flex:1;white-space:nowrap;font-size:.82rem;padding:8px 5px}
    .managed{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:13px 0;border-bottom:1px solid #e7ebf2}.managed-info{flex:1;min-width:0;overflow-wrap:anywhere}.managed-info strong{display:block}.managed-info small{color:#66748b}.managed button{padding:8px 10px}
    .field{margin:16px 0}.field label{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px}.field input{width:100%;min-height:45px;border:1px solid #b9c6d8;border-radius:9px;padding:10px;background:#fff;color:#172235}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.footnote{margin-top:14px;font-size:.78rem;color:#60718a}.empty{padding:32px 0;text-align:center;color:#617089}
    .hidden{display:none!important}@media(min-width:520px){.count-row{grid-template-columns:1fr 1fr;max-width:280px;margin:0}.family-line{align-items:center}.family{display:flex;align-items:center;justify-content:space-between;gap:10px}.family-name{width:50%}}
  </style>
</head>
<body>
<main class="shell"><section class="card" id="app" aria-live="polite"></section></main>
<script>
(()=>{
'use strict';
const KEY='guest-counter-v1';
const example=[['Johnson Family',2,3],['Smith Family',2,2],['Williams Family',2,1],['Brown Family',2,0],['Davis Family',2,4]];
function makeFamily(name,a,c){return {id:crypto.randomUUID(),name,baseAdults:a,baseChildren:c,adults:a,children:c,checked:true};}
function load(){try{const parsed=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(parsed)&&parsed.every(f=>typeof f.id==='string'&&typeof f.name==='string'))return parsed;}catch{}return example.map(x=>makeFamily(...x));}
let families=load(),screen='counter',editId=null;
const root=document.querySelector('#app');
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(families));}catch{alert('Could not save changes. Check browser storage settings.');}};
const find=id=>families.find(f=>f.id===id);
const num=n=>Number.isInteger(n)&&n>=0?n:0;
function render(){
if(screen==='counter'){
 const totalA=families.reduce((n,f)=>n+(f.checked?f.adults:0),0),totalC=families.reduce((n,f)=>n+(f.checked?f.children:0),0);
 root.innerHTML=`<header><h1>Guest Counter</h1><button data-action="manage">⚙ Edit Families</button></header>
 <div class="summary"><div class="metric"><div class="label">Adults</div><div class="number">${totalA}</div></div><div class="metric"><div class="label">Children</div><div class="number">${totalC}</div></div><div class="metric total"><div class="label">Total</div><div class="number">${totalA+totalC}</div></div></div>
 ${families.length?families.map(f=>`<div class="family ${f.checked?'':'off'}"><label class="family-name"><input aria-label="Include ${escape(f.name)}" type="checkbox" data-action="toggle" data-id="${f.id}" ${f.checked?'checked':''}/><span>${escape(f.name)}</span></label><div class="count-row">${['adults','children'].map(k=>`<div class="counter"><div class="label">${k==='adults'?'Adults':'Children'}</div><div class="controls"><button aria-label="Remove one ${k} from ${escape(f.name)}" data-action="adjust" data-id="${f.id}" data-key="${k}" data-step="-1" ${!f.checked||f[k]===0?'disabled':''}>−</button><output>${f[k]}</output><button aria-label="Add one ${k} to ${escape(f.name)}" data-action="adjust" data-id="${f.id}" data-key="${k}" data-step="1" ${!f.checked?'disabled':''}>+</button></div></div>`).join('')}</div></div>`).join(''):'<div class="empty">No families yet. Select Edit Families to add one.</div>'}
 <div class="actions"><button data-action="clear">Clear All</button><button data-action="select">Select All</button><button data-action="reset">↻ Reset Counts</button></div>
 <p class="footnote">Unchecking a family excludes them from the total but keeps their counts. Reset Counts restores preset adult/child counts without changing checkboxes. Changes save automatically on this device.</p>`;
}else if(screen==='manage'){
 root.innerHTML=`<header><button data-action="home">← Back</button><h2>Manage Families</h2></header>${families.map(f=>`<div class="managed"><div class="managed-info"><strong>${escape(f.name)}</strong><small>${f.baseAdults} adults · ${f.baseChildren} children (preset)</small></div><button data-action="edit" data-id="${f.id}">Edit</button><button class="danger" aria-label="Delete ${escape(f.name)}" data-action="delete" data-id="${f.id}">✕</button></div>`).join('')}<div style="margin-top:20px"><button class="primary" style="width:100%" data-action="add">+ Add Family</button></div>`;
}else{
 const f=editId?find(editId):null;
 root.innerHTML=`<header><button data-action="manage">← Cancel</button><h2>${f?'Edit Family':'Add Family'}</h2></header><form id="family-form"><div class="field"><label for="family-name">Family name</label><input id="family-name" name="name" maxlength="100" required autocomplete="off" value="${escape(f?.name??'')}" placeholder="e.g. Johnson Family"/></div><div class="form-grid"><div class="field"><label for="adults">Default adults</label><input id="adults" name="adults" type="number" min="0" max="999" step="1" required value="${f?.baseAdults??2}"/></div><div class="field"><label for="children">Default children</label><input id="children" name="children" type="number" min="0" max="999" step="1" required value="${f?.baseChildren??0}"/></div></div><button class="primary" style="width:100%" type="submit">Save Family</button><p class="footnote">Editing preset counts will update this family's current counts too.</p></form>`;
 }
}
root.addEventListener('click',e=>{
 const b=e.target.closest('button[data-action]');if(!b)return;
 const action=b.dataset.action,id=b.dataset.id,f=id?find(id):null;
 if(action==='manage'){screen='manage';render();}
 else if(action==='home'){screen='counter';render();}
 else if(action==='add'){editId=null;screen='form';render();}
 else if(action==='edit'&&f){editId=id;screen='form';render();}
 else if(action==='delete'&&f){if(confirm(`Remove ${f.name}?`)){families=families.filter(x=>x.id!==id);save();render();}}
 else if(action==='adjust'&&f){const k=b.dataset.key,step=Number(b.dataset.step);if(f.checked&&['adults','children'].includes(k)){f[k]=Math.max(0,Math.min(999,f[k]+step));save();render();}}
 else if(action==='clear'){families.forEach(f=>f.checked=false);save();render();}
 else if(action==='select'){families.forEach(f=>f.checked=true);save();render();}
 else if(action==='reset'){families.forEach(f=>{f.adults=f.baseAdults;f.children=f.baseChildren;});save();render();}
});
root.addEventListener('change',e=>{if(e.target.matches('input[data-action="toggle"]')){const f=find(e.target.dataset.id);if(f){f.checked=e.target.checked;save();render();}}});
root.addEventListener('submit',e=>{
 if(e.target.id!=='family-form')return;e.preventDefault();const fd=new FormData(e.target),name=String(fd.get('name')||'').trim(),a=Number(fd.get('adults')),c=Number(fd.get('children'));
 if(!name||!Number.isInteger(a)||!Number.isInteger(c)||a<0||c<0||a>999||c>999){alert('Enter a family name and whole-number counts from 0 to 999.');return;}
 if(editId){const f=find(editId);if(f){Object.assign(f,{name,baseAdults:a,baseChildren:c,adults:a,children:c});}}
 else families.push(makeFamily(name,a,c));save();screen='manage';render();
});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
